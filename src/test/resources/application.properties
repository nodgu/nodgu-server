# 테스트 전용 설정.
# src/main/resources/application.properties 대신 이 파일이 쓰이므로 .env(실제 DB 접속 정보)를 읽지 않는다.
# 테스트는 항상 H2 메모리 DB에서만 돈다.

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

jwt.secret=testSecretKeyForTestsOnlyThisMustBeAtLeast256BitsLongXXXX
jwt.expiration=3600000
jwt.refresh-expiration=86400000

# 메일은 테스트에서 mock으로 대체한다 (실제로 보내지 않음)
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=test@example.com
spring.mail.password=test

app.notification.api-key=

springdoc.swagger-ui.enabled=false
