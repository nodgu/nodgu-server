<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>비밀번호 재설정</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f5f7;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color:#f4f5f7;">
  <tr>
    <td align="center" style="padding:32px 16px;">
      <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:480px;background-color:#ffffff;border-radius:12px;">
        <tr>
          <td style="padding:32px 32px 8px 32px;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;">
            <div style="font-size:14px;font-weight:700;letter-spacing:0.08em;color:#2f5bea;">NODGU</div>
            <h1 style="margin:16px 0 0 0;font-size:22px;line-height:1.4;font-weight:700;color:#111827;">비밀번호 재설정</h1>
            <p style="margin:12px 0 0 0;font-size:15px;line-height:1.6;color:#4b5563;">
              비밀번호 재설정을 요청하셨나요?<br>
              앱의 비밀번호 재설정 화면에 아래 토큰을 붙여 넣어 주세요.
            </p>
          </td>
        </tr>
        <tr>
          <td style="padding:20px 32px 0 32px;">
            <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
              <tr>
                <td align="center" style="padding:18px 12px;background-color:#f0f4ff;border:1px solid #d6e0fd;border-radius:8px;font-family:'SFMono-Regular',Menlo,Consolas,monospace;font-size:15px;font-weight:600;color:#1e3a8a;word-break:break-all;-webkit-user-select:all;user-select:all;">{{token}}</td>
              </tr>
            </table>
            <p style="margin:10px 0 0 0;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:13px;line-height:1.5;color:#6b7280;text-align:center;">
              토큰은 <strong style="color:#111827;">{{validity}}</strong> 동안 한 번만 사용할 수 있어요.
            </p>
          </td>
        </tr>
        <tr>
          <td style="padding:28px 32px 32px 32px;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;">
            <div style="border-top:1px solid #e5e7eb;padding-top:20px;font-size:13px;line-height:1.6;color:#6b7280;">
              직접 요청하지 않으셨다면 이 메일은 무시하셔도 돼요. 비밀번호는 바뀌지 않아요.
            </div>
          </td>
        </tr>
      </table>
      <div style="padding:16px;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:12px;color:#5f6672;">
        이 메일은 발신 전용이에요.
      </div>
    </td>
  </tr>
</table>
</body>
</html>
